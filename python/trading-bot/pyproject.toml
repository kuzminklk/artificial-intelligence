[project]
name = "bot"
version = "0.1.0"
description = "Experimental LLM-driven trading bot (Binance via ccxt, Claude as decision provider)"
requires-python = ">=3.11"
dependencies = [
	"anthropic>=0.40",
	"ccxt>=4.4",
	"pandas>=2.2",
	"pydantic>=2.8",
	"python-dotenv>=1.0",
]

[dependency-groups]
dev = ["mypy>=1.11", "ruff>=0.6", "pandas-stubs", "pytest>=8"]

[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
